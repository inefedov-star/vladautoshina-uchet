<title>Витрина IVANOR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Планшет в зале: шапка с подбором размера, ниже сетка моделей; карточка модели открывается листом снизу.
   Токены — дизайн-система IVANOR (бумага, тушь, сигнальный оранжевый, холодный синий). */
:root{
  --paper:#F2EFE8; --paper-2:#EAE6DB; --paper-3:#E1DCCE;
  --ink:#16160F; --ink-2:#3A382E; --ink-3:#6E6B5D;
  --rule:rgba(22,22,15,.16); --rule-soft:rgba(22,22,15,.08);
  --signal:#D8410C; --signal-deep:#A82F06; --signal-tint:rgba(216,65,12,.10);
  --cold:#26586F; --cold-tint:rgba(38,88,111,.12);
  --moss:#4B6A38; --moss-tint:rgba(75,106,56,.12);
  --on-ink:#F2EFE8; --scrim:rgba(22,22,15,.45);
  --f-display:'Fira Sans Extra Condensed','Golos Text',system-ui,sans-serif;
  --f-text:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Roboto Mono',monospace;
  --ease:cubic-bezier(.16,.84,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1A1A14; --paper-2:#222219; --paper-3:#2D2C22;
  --ink:#EDE9DF; --ink-2:#C9C4B6; --ink-3:#958F7E;
  --rule:rgba(237,233,223,.16); --rule-soft:rgba(237,233,223,.08);
  --signal:#F0662E; --signal-deep:#FF8A57; --signal-tint:rgba(240,102,46,.16);
  --cold:#7DB3CC; --cold-tint:rgba(125,179,204,.16);
  --moss:#9DC181; --moss-tint:rgba(157,193,129,.16);
  --on-ink:#16160F; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1A1A14; --paper-2:#222219; --paper-3:#2D2C22;
  --ink:#EDE9DF; --ink-2:#C9C4B6; --ink-3:#958F7E;
  --rule:rgba(237,233,223,.16); --rule-soft:rgba(237,233,223,.08);
  --signal:#F0662E; --signal-deep:#FF8A57; --signal-tint:rgba(240,102,46,.16);
  --cold:#7DB3CC; --cold-tint:rgba(125,179,204,.16);
  --moss:#9DC181; --moss-tint:rgba(157,193,129,.16);
  --on-ink:#16160F; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;font-weight:500}
.tnum{font-variant-numeric:tabular-nums}

/* шапка */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px 10px}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo svg{width:34px;height:34px}
.logo b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.logo i{display:block;font-style:normal;font-family:var(--f-mono);font-size:.58rem;letter-spacing:.2em;color:var(--ink-3);margin-top:3px}
.bar .spacer{flex:1}
.tool{border:1.5px solid var(--rule);background:transparent;border-radius:3px;padding:.55em .8em;font-size:.88rem;font-weight:600;min-height:44px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* подбор размера */
.pickbox{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper-2)}
.pick{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:start}
.pick .lbl{color:var(--ink-3);width:84px;padding-top:9px;font-size:.66rem}
.row{display:flex;flex-wrap:wrap;gap:5px;padding-block:1px;min-width:0}
.psum{display:flex;align-items:center;gap:10px;padding-block:6px 8px;font-weight:600}
.psum .tool{min-height:36px;padding:0 12px}
.psum span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:44px;min-height:36px;padding:0 10px;border:1.2px solid var(--rule);border-radius:3px;background:var(--paper);
  font-family:var(--f-mono);font-weight:700;font-size:.9rem;transition:background .2s,border-color .2s,color .2s}
.chip:active{transform:translateY(1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip.dim{opacity:.32}
.chip.txt{font-family:var(--f-text);font-weight:600;font-size:.88rem}
.chip.w[aria-pressed="true"]{background:var(--cold);border-color:var(--cold);color:var(--on-ink)}
.chip.s[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--on-ink)}
.size-now{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.size-now b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);letter-spacing:-.02em;line-height:1}
.size-now b em{font-style:normal;color:var(--ink-3)}
.reset{border:0;background:none;color:var(--signal-deep);font-weight:600;padding:8px 4px;min-height:44px}

/* результаты */
.res-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 12px}
.res-hd h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,2.4vw,1.7rem);text-transform:uppercase;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sort{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:40px}
.card{display:flex;flex-direction:column;text-align:left;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper-2);padding:0;overflow:hidden;
  transition:border-color .25s,transform .25s var(--ease)}
.card:hover{border-color:var(--ink)}
.card:active{transform:scale(.99)}
.pimg{width:100%;height:100%;object-fit:contain;background:#fff}
.pimg{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:200;background:rgba(15,16,20,.82);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;opacity:0;transition:opacity .18s}
.zoom.on{opacity:1}.zoom img{max-width:min(92vw,1100px);max-height:86vh;object-fit:contain;background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.zoom button{position:absolute;top:16px;right:16px;width:52px;height:52px;border-radius:26px;border:0;background:#fff;font-size:28px;line-height:1;cursor:pointer}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--paper-3);display:grid;place-items:center;overflow:hidden}
.ph svg{width:62%;height:auto}
.ph .tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.4em .6em;border-radius:2px;border:1.2px solid currentColor}
.tag.win{color:var(--cold);background:var(--cold-tint)}
.tag.sum{color:var(--moss);background:var(--moss-tint)}
.tag.all{color:var(--ink-2);background:var(--rule-soft)}
.tag.stud{color:var(--signal-deep);background:var(--signal-tint)}
.cb{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.brand{color:var(--ink-3)}
.model{font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.alias{font-size:.85rem;color:var(--ink-3)}
.sizes{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.sz{font-family:var(--f-mono);font-size:.74rem;font-weight:500;padding:.18em .45em;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2)}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--rule-soft)}
.price b{font-family:var(--f-display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;line-height:1}
.price b small{font-family:var(--f-text);font-weight:500;font-size:.8rem;color:var(--ink-3);letter-spacing:0;margin-right:3px}
.price span{font-size:.82rem;color:var(--ink-3);text-align:right}
.stock{font-size:.82rem;font-weight:600;color:var(--moss)}
.stock.low{color:var(--signal-deep)}

.empty{padding:60px 0;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--ink);text-transform:uppercase;margin-bottom:6px}

/* лист модели */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;background:var(--paper);border-top:2px solid var(--ink);
  border-radius:6px 6px 0 0;transform:translateY(100%);transition:transform .38s var(--ease);
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sh-in{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 0}
.sh-top{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:22px;align-items:start}
.sh-top .ph{border:1.5px solid var(--rule);border-radius:3px}
.close{position:sticky;top:0;float:right;border:1.5px solid var(--ink);background:var(--paper);border-radius:3px;width:48px;height:48px;font-size:1.4rem;line-height:1}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.5px;background:var(--rule);border:1.5px solid var(--rule);margin-top:14px}
.facts div{background:var(--paper);padding:10px 12px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:3px 0 0;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:.98rem}
th{text-align:left;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:8px 10px;border-bottom:1.5px solid var(--ink)}
td{padding:12px 10px;border-bottom:1px solid var(--rule)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.sz2{font-family:var(--f-mono);font-weight:700}
tr.hit td{background:var(--signal-tint)}
.tw{overflow-x:auto}
.note{font-size:.8rem;color:var(--ink-3);padding-block:6px 0}


/* разделы */
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule-soft);margin-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 16px 11px;min-height:48px;font-family:var(--f-display);font-weight:800;font-size:1.12rem;
  text-transform:uppercase;letter-spacing:.01em;color:var(--ink-3);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab sup{font-family:var(--f-mono);font-size:.62rem;font-weight:500;color:var(--ink-3);margin-left:4px;letter-spacing:.05em}
.search{width:100%;min-height:40px;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper-2);padding:0 14px;font:inherit;font-size:1rem;color:var(--ink)}
.search:focus{outline:none;border-color:var(--signal)}
.spec{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);letter-spacing:-.01em}
.big{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1;letter-spacing:-.02em}
.list{display:flex;flex-direction:column;border-top:1.5px solid var(--ink);margin-bottom:40px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:baseline;padding:13px 4px;border-bottom:1px solid var(--rule)}
.li .nm{min-width:0}
.li .nm small{display:block;color:var(--ink-3);font-size:.8rem;margin-top:2px}
.li .pr{font-family:var(--f-display);font-weight:800;font-size:1.3rem;white-space:nowrap}
.li .stock{white-space:nowrap}
@media (max-width:640px){.li{grid-template-columns:minmax(0,1fr) auto}.li .stock{grid-column:1/-1}}

@media (max-width:640px){
  .pick{grid-template-columns:1fr}
  .pick .lbl{width:auto;padding-top:4px}
  .sh-top{grid-template-columns:1fr}
  .sh-top .ph{max-width:260px}
  .bar .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== дизайн v2 (02.11.2026): светлый, плоский, в цветах IVANOR — как раздел «Магазин» ===== */
:root,:root[data-theme="dark"]{--bg:#F4F5F7;--paper:#FFFFFF;--paper-2:#F1F2F4;--paper-3:#F7F8FA;--ink:#1B1D21;--ink-2:#4A4F57;--ink-3:#6B7079;
  --rule:#E1E4E8;--rule-soft:#EEF0F2;--signal:#FF6600;--signal-deep:#B34700;--signal-tint:#FFF1E8;--cold:#2563C9;--cold-tint:#E5EEFC;
  --moss:#1E7A44;--moss-tint:#E8F5EC;--on-ink:#FFFFFF;--scrim:rgba(20,22,26,.45);
  --f-display:'Montserrat','Golos Text',system-ui,sans-serif;--f-text:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#F4F5F7;--paper:#FFFFFF;--paper-2:#F1F2F4;--paper-3:#F7F8FA;--ink:#1B1D21;--ink-2:#4A4F57;--ink-3:#6B7079;
  --rule:#E1E4E8;--rule-soft:#EEF0F2;--signal:#FF6600;--signal-deep:#B34700;--signal-tint:#FFF1E8;--cold:#2563C9;--cold-tint:#E5EEFC;--moss:#1E7A44;--moss-tint:#E8F5EC;--on-ink:#FFFFFF;--scrim:rgba(20,22,26,.45);color-scheme:light}}
body{background:var(--bg)}
.mono{font-family:var(--f-text);letter-spacing:0;text-transform:none;font-size:.78rem}
.top{background:var(--paper);border-bottom:1px solid var(--rule)}
.logo b,.res-hd h1,.empty b,.tab{text-transform:none;letter-spacing:-.01em}
.logo b,.res-hd h1,.model,.price b,.size-now b,.empty b{font-weight:700}
.logo svg rect{fill:var(--signal)}.logo svg circle:first-of-type{stroke:#fff}.logo svg circle:last-of-type{fill:var(--signal)}
.logo i{font-family:var(--f-text);letter-spacing:.04em}
.tool{border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab{font-family:var(--f-text);font-weight:600;font-size:1.02rem}
.tab sup{font-family:var(--f-text);letter-spacing:0}
.pickbox{border:0;border-radius:16px;background:var(--paper)}
.chip{border:0;border-radius:9px;background:var(--paper-2)}
.chip[aria-pressed="true"],.chip.w[aria-pressed="true"],.chip.s[aria-pressed="true"]{background:var(--signal);color:#fff}
.search{border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.card{border:0;border-radius:18px;background:var(--paper);box-shadow:0 1px 2px rgba(16,24,40,.06)}
.card:hover{box-shadow:0 0 0 1px var(--rule),0 6px 16px rgba(16,24,40,.08)}
.ph{background:#fff}
.tag{font-family:var(--f-text);letter-spacing:0;text-transform:none;font-size:.72rem;font-weight:600;border:0;border-radius:7px;padding:.3em .6em}
.tag.all{background:var(--paper-2)}
.sz{font-family:var(--f-text);border:0;background:var(--paper-2);border-radius:6px}
.model{font-size:1.3rem;line-height:1.1}
.price{border-top:1px solid var(--rule-soft)}.price b{font-size:1.55rem}
.sheet{background:var(--bg);border-top:0;border-radius:22px 22px 0 0}
.sh-top .ph{border:0;border-radius:16px}
.close{border-radius:12px;border:1px solid var(--rule);background:var(--paper)}
.facts{gap:8px;background:transparent;border:0}.facts div{background:var(--paper);border-radius:12px}
th{font-family:var(--f-text);letter-spacing:0;text-transform:none;font-size:.76rem;font-weight:600;border-bottom:1px solid var(--rule)}
td{border-bottom:1px solid var(--rule-soft)}td.sz2{font-family:var(--f-text)}
.tw{background:var(--paper);border-radius:14px;padding:0 10px}
.spec{font-family:var(--f-text)}
.empty b{font-size:1.3rem}
/* режим продавца */
.addb{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:var(--signal);color:#fff;font-size:1.5rem;font-weight:700;cursor:pointer;flex:none;margin-left:auto}
.card .price .addb{margin-left:auto;align-self:center}.li .addb{margin-left:10px}
.cartfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;min-height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--ink);color:var(--paper);font:600 1rem var(--f-text,inherit);box-shadow:0 8px 22px rgba(0,0,0,.25);cursor:pointer}
.cartfab b{color:#FFB37A}
.vtoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:40;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}.vtoast.on{opacity:1;transform:translateX(-50%)}
.pinv{font-size:2rem;letter-spacing:.3em;text-align:center;min-height:48px;margin:10px 0}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}.pinpad button{min-height:64px;border-radius:16px;border:1px solid var(--rule);background:var(--paper-2);font-size:1.4rem;font-weight:700;cursor:pointer}
.pinpad button[data-k="Войти"]{background:var(--signal);color:#fff;border-color:var(--signal);font-size:1rem}
.cart{display:flex;flex-direction:column;gap:8px}.cl{display:grid;grid-template-columns:1fr auto 110px auto 36px;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--paper-2)}
.cn{font-weight:600}.cn small{display:block;font-weight:500;color:var(--ink-3);font-size:.8rem}
.cq{display:flex;align-items:center;gap:8px}.cq button{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:1.2rem;cursor:pointer}
.cp{width:110px;min-height:40px;border-radius:10px;border:1px solid var(--rule);padding:0 8px;font:inherit;text-align:right}.cx{width:36px;height:36px;border-radius:10px;border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--ink-3)}
.ctot{text-align:right;font-size:1.2rem;margin:12px 0}.ctot b{font-size:1.5rem}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cform label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--ink-3)}.cform input{min-height:46px;border-radius:12px;border:1px solid var(--rule);padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper)}
.cpay{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.cpay button{min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-weight:600;cursor:pointer}.cpay button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.csend{width:100%;min-height:58px;margin-top:14px;border-radius:16px;border:0;background:var(--signal);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer}.csend:disabled{opacity:.5}
.mysh{margin:24px 0 8px;font-size:1.05rem}.ms{display:grid;grid-template-columns:52px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft,#eee);font-size:.92rem}.ms small{display:block;color:var(--signal-deep)}
.mst{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:8px}.mst.w{background:#FFF4E5;color:#8A4B00}.mst.ok{background:#E8F5EC;color:#1E6B39}.mst.x{background:#FDECEC;color:#A12A2A}

/* внутри пульта: выход и «на весь экран» — у пульта свои; на телефоне шапка в одну строку */

  --signal:#FF7A1A;--signal-deep:#FF9A4D;--signal-tint:rgba(255,122,26,.16);--cold:#6FA8FF;--cold-tint:rgba(111,168,255,.16);--moss:#7EE2A0;--moss-tint:rgba(126,226,160,.14);--on-ink:#121418;--scrim:rgba(0,0,0,.6);color-scheme:dark}

@media(max-width:600px){#fs{display:none}.bar .logo i{display:none}}
.csug{display:flex;flex-direction:column;gap:6px}.csb{display:block;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:9px 12px;min-height:46px;font:inherit}.csb small{display:block;color:var(--ink-3);font-size:.8rem}.chint{margin:0;padding:8px 12px;border-radius:10px;background:var(--paper-2);font-size:.86rem;color:var(--ink-2)}
.supb{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700;font-size:.78rem;background:#FFE7D6;color:#9A3D06;margin-right:4px}html[data-theme="dark"] .supb{background:#4A2A14;color:#FFC79E}
.pwf{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin:4px 0 10px}.pwf label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--ink-3,#777)}.pwf input{width:92px;padding:8px 10px;border:1px solid var(--rule);border-radius:10px;font:inherit;font-size:1rem;background:var(--paper,#fff);color:inherit}
.pwr{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}.pwr img,.pwi{width:112px;height:112px;object-fit:contain;background:#fff;border-radius:10px}.pwt b{display:block}.pwt small,.pwp small{display:block;color:var(--ink-3);font-size:.82rem}.pwp{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}.pwp b{font-size:1.25rem}
.pdiag{font-size:.78rem;color:var(--ink-3);background:var(--paper-2);border-radius:10px;padding:8px 10px;margin:0 0 8px}

  <div class="wrap">
    <div class="bar">
      <div class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="2" fill="var(--ink)"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="var(--signal)" stroke-width="3"/><circle cx="16" cy="16" r="3.4" fill="var(--paper)"/></svg>
        <span><b>В наличии</b><i>IVANOR · НОЯБРЬСКАЯ 129</i></span>
      </div>
      <div class="spacer"></div>
      <span class="mono hide-sm" id="stamp" style="color:var(--ink-3)"></span>
      <button class="tool" id="selBtn" type="button" title="Вход продавца">Продавец</button>
      <button class="tool" id="fs" type="button">На весь экран</button>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>

  </div>
</header>

<main class="wrap">
  <section class="pickbox" id="pickbox"><div class="pick" id="pick"></div></section>
  <div class="res-hd">
    <h1 id="resTitle"></h1>
    <button class="tool" type="button" id="pwBtn" hidden style="border-color:var(--signal);color:var(--signal-deep);font-weight:700">Посмотреть на заказ</button>
    <div class="sort" id="sort">
      <button class="tool" type="button" data-sort="price" aria-pressed="true">Сначала дешевле</button>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="shTitle" hidden>
  <div class="sh-in" id="shIn"></div>
</section>

<script>
/* пульт живёт в /pult/; пока папку на сайте не переименовали — в /montazh/ */
let PBASE='/pult/';function pfetch(path,opt){const b=PBASE;return fetch(b+path,opt).then(r=>{if(r.status!==404||b!=='/pult/')return r;PBASE='/montazh/';return fetch(PBASE+path,opt);});}

try{if(window.self!==window.top)document.documentElement.classList.add('embed');}catch(_){document.documentElement.classList.add('embed');}
(function(){function t(){var d=false;try{d=window.self!==window.top&&localStorage.getItem('ivanor_theme')==='dark';}catch(_){}var h=document.documentElement;if(d){h.setAttribute('data-theme','dark');h.style.backgroundColor='#121418';h.style.colorScheme='dark';}else{h.removeAttribute('data-theme');h.style.backgroundColor='';h.style.colorScheme='';}}t();window.__ivTheme=t;window.addEventListener('storage',function(e){if(e.key==='ivanor_theme'||e.key===null)t();});})();

let STAMP='__STAMP__';
let TIRES=__TIRES__;
let OTHER=__OTHER__;
/* фото моделей — из учёта на этом же сайте (vladautoshina.ru/pult); если недоступно — остаются схемы */
let PH={};
pfetch('api.php?a=photos_public',{credentials:'omit',cache:'no-cache'}).then(r=>r.json()).then(j=>{const b='/'+(j.base||'pult/');PH={};Object.entries(j.photos||{}).forEach(([k,v])=>PH[k]=b+v);if(Object.keys(PH).length&&typeof renderOut==='function')renderOut();}).catch(()=>{});
const phImg=(list,svg)=>{const o=list.find(x=>PH[x.id]);return o?`<img class="pimg" src="${PH[o.id]}" alt="" loading="lazy">`:svg;};
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rub=n=>n.toLocaleString('ru-RU').replace(/ |\s/g,' ')+' ₽';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c;};
const uniq=a=>[...new Set(a.filter(v=>v!=null))].sort((x,y)=>(typeof x==='number'?x-y:String(x).localeCompare(String(y),'ru',{numeric:true})));
const stockTxt=q=>q>=8?'8+ шт.':q+' шт.';
const stockHtml=(q,set=4)=>`<span class="stock ${q<set?'low':''}">${stockTxt(q)}</span>`;
$('#stamp').textContent='Наличие на '+STAMP;

const by=t=>OTHER.filter(o=>o.t===t);
let DISKS=by('disk'),AKB=by('akb'),FAST=by('fast');
let MORE=OTHER.filter(o=>['acc','tube','tool','tireo'].includes(o.t)).map(o=>({...o,g:o.t==='acc'?(o.g||'acc'):o.t}));

/* ---------- общее состояние ---------- */
const S={tab:'tires',sort:'price',q:'',
  tires:{d:16,w:205,p:55,s:'winter'},disks:{d:null,pcd:null,k:null},akb:{std:null,pol:null,cap:null},fast:{k:null,th:null},more:{g:null}};

/* ---------- разметка фильтров ---------- */
function chipRow(label,vals,cur,avail,fmt,onPick,cls){
  const row=document.createElement('div');row.className='row';
  vals.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.className='chip '+(cls?cls(v):'');
    b.textContent=t;b.setAttribute('aria-pressed',cur===v);if(avail&&!avail.has(v))b.classList.add('dim');
    b.onclick=()=>onPick(cur===v?null:v);row.appendChild(b);});
  const l=document.createElement('span');l.className='mono lbl';l.textContent=label;
  return [l,row];
}
function searchRow(ph){
  const l=document.createElement('span');l.className='mono lbl';l.textContent='Поиск';
  const i=document.createElement('input');i.className='search';i.id='q-'+S.tab;i.type='search';i.placeholder=ph;i.value=S.q;
  i.oninput=()=>{S.q=i.value;renderOut();psum();};return [l,i];
}
const qmatch=(text)=>!S.q||S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>text.toLowerCase().includes(w));
const sortList=(arr,price,name)=>{const a=[...arr];
  if(S.sort==='price')a.sort((x,y)=>price(x)-price(y));else if(S.sort==='desc')a.sort((x,y)=>price(y)-price(x));
  else a.sort((x,y)=>name(x).localeCompare(name(y),'ru',{numeric:true}));return a;};

/* ---------- ШИНЫ ---------- */
const SEAS={winter:['Зима','win'],summer:['Лето','sum'],all:['Всесезон','all']};
const tSize=o=>`${o.w}/${o.p} R${o.d}${o.c?'C':''}`;
function tMatch(o,skip){const f=S.tires;
  return (skip==='d'||f.d==null||o.d===f.d)&&(skip==='w'||f.w==null||o.w===f.w)&&(skip==='p'||f.p==null||o.p===f.p)
   &&(skip==='s'||f.s==null||(f.s==='stud'?o.st:f.s==='fric'?(o.s==='winter'&&!o.st):o.s===f.s))
   &&qmatch(`${o.b} ${o.m} ${o.a||''} ${tSize(o)}`);}
function tireSvg(o){
  const col=o.s==='winter'?'var(--cold)':o.s==='summer'?'var(--moss)':'var(--ink-3)';let tr='';
  for(let i=0;i<36;i++){const a=i*10*Math.PI/180;tr+=`<line x1="${(100+78*Math.cos(a)).toFixed(1)}" y1="${(100+78*Math.sin(a)).toFixed(1)}" x2="${(100+92*Math.cos(a+.08)).toFixed(1)}" y2="${(100+92*Math.sin(a+.08)).toFixed(1)}"/>`;}
  const studs=o.st?Array.from({length:18},(_,i)=>{const a=i*20*Math.PI/180;return `<circle cx="${(100+85*Math.cos(a)).toFixed(1)}" cy="${(100+85*Math.sin(a)).toFixed(1)}" r="2.2"/>`}).join(''):'';
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="94" fill="var(--ink)"/><g stroke="var(--paper-3)" stroke-width="3" stroke-opacity=".35">${tr}</g><g fill="var(--paper)" fill-opacity=".85">${studs}</g><circle cx="100" cy="100" r="66" fill="var(--paper-2)" stroke="${col}" stroke-width="5"/><circle cx="100" cy="100" r="18" fill="var(--paper-3)" stroke="var(--rule)" stroke-width="2"/><text x="100" y="58" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="var(--ink-3)" letter-spacing="1.5">R${o.d}</text></svg>`;}
const tTags=o=>{const[s,c]=SEAS[o.s];return `<span class="tag ${c}">${s}</span>${o.st?'<span class="tag stud">Шипы</span>':o.s==='winter'?'<span class="tag win">Липучка</span>':''}${o.suv?'<span class="tag all">SUV</span>':''}`;};
const TIRES_PICK=()=>{const f=S.tires,set=(k)=>v=>{f[k]=v;renderAll();};
  const out=[];
  const l=document.createElement('span');l.className='mono lbl';l.textContent='Размер';
  const sn=document.createElement('div');sn.className='size-now';
  sn.innerHTML=`<b>${f.w??'<em>___</em>'}/${f.p??'<em>__</em>'} R${f.d??'<em>__</em>'}</b>`;
  if(f.d||f.w||f.p||f.s){const r=document.createElement('button');r.className='reset';r.type='button';r.textContent='Сбросить всё';r.onclick=()=>{Object.keys(f).forEach(k=>f[k]=null);S.q='';renderAll();};sn.appendChild(r);}
  out.push(l,sn);
  out.push(...chipRow('Диаметр',uniq(TIRES.map(o=>o.d)).map(v=>[v,'R'+v]),f.d,new Set(TIRES.filter(o=>tMatch(o,'d')).map(o=>o.d)),0,set('d')));
  out.push(...chipRow('Ширина',uniq(TIRES.map(o=>o.w)).map(v=>[v,v]),f.w,new Set(TIRES.filter(o=>tMatch(o,'w')).map(o=>o.w)),0,set('w')));
  out.push(...chipRow('Профиль',uniq(TIRES.map(o=>o.p)).map(v=>[v,v]),f.p,new Set(TIRES.filter(o=>tMatch(o,'p')).map(o=>o.p)),0,set('p')));
  out.push(...chipRow('Сезон',[['winter','Вся зима'],['stud','Шипы'],['fric','Липучка'],['summer','Лето'],['all','Всесезон']],f.s,null,0,set('s'),v=>'txt '+(v==='summer'?'s':v==='all'?'':'w')));
  out.push(...searchRow('Бренд или модель: Ikon, Pirelli, Ice 9…'));
  return out;};
function tiresOut(){
  const rows=TIRES.filter(o=>tMatch(o));const m=new Map();
  rows.forEach(o=>{const k=o.b+'|'+o.m+'|'+o.st+'|'+o.s;if(!m.has(k))m.set(k,[]);m.get(k).push(o);});
  let g=[...m.values()].map(list=>({list,o:list[0],min:Math.min(...list.map(x=>x.pr)),max:Math.max(...list.map(x=>x.pr))}));
  g=sortList(g,x=>S.sort==='desc'?x.max:x.min,x=>x.o.b+' '+x.o.m);
  const f=S.tires,full=f.d&&f.w&&f.p;
  title(rows.length?(full?`${f.w}/${f.p} R${f.d}: `:'')+`${g.length} ${plural(g.length,'модель','модели','моделей')} шин`:'');
  if(!rows.length)return empty('Такого размера сейчас нет','Привезём под заказ — уточните у продавца. Или уберите один из фильтров.'+(SEL&&full&&document.documentElement.classList.contains('embed')?`<p style="margin-top:14px"><button class="tool" type="button" id="toZak" style="background:var(--signal);border-color:var(--signal);color:#fff">Оформить заказ на ${f.w}/${f.p} R${f.d}</button></p>`:''));
  const html=`<div class="grid">${g.map((x,i)=>{const o=x.o,one=x.list.length===1;
    const szs=one?'':`<div class="sizes">${x.list.slice(0,6).map(s=>`<span class="sz">${tSize(s)}</span>`).join('')}${x.list.length>6?`<span class="sz">+${x.list.length-6}</span>`:''}</div>`;
    return `<button class="card" type="button" data-i="${i}"><div class="ph">${phImg(x.list,tireSvg(o))}<div class="tags">${tTags(o)}</div></div>
      <div class="cb"><span class="mono brand">${esc(o.b)}${one?' · '+tSize(o):''}</span><span class="model">${esc(o.m)}</span>
      ${o.a?`<span class="alias">Известна как ${esc(o.a)}</span>`:''}${szs}
      <div class="price"><b class="tnum">${one?'':'<small>от</small>'}${rub(x.min)}</b><span>${one?`за 4 шт. ${rub(o.pr*4)}<br>${stockHtml(o.q)}`:`${x.list.length} ${plural(x.list.length,'размер','размера','размеров')}`}</span></div></div></button>`;}).join('')}</div>`;
  return [html,el=>el.querySelectorAll('.card').forEach(b=>b.onclick=()=>tireSheet(g[+b.dataset.i]))];
}
function tireSheet(x){const o=x.o;
  const all=TIRES.filter(r=>r.b===o.b&&r.m===o.m&&r.st===o.st&&r.s===o.s).sort((a,b)=>a.d-b.d||a.w-b.w||a.p-b.p);
  const hit=new Set(x.list.map(r=>r.id)),f=S.tires;
  sheet(`<div class="sh-top"><div class="ph">${phImg(all,tireSvg(o))}<div class="tags">${tTags(o)}</div></div><div style="min-width:0">
    <span class="mono brand">${esc(o.b)}</span><h2 class="model" id="shTitle" style="font-size:clamp(1.8rem,4vw,2.6rem);margin:4px 0 6px">${esc(o.m)}</h2>
    ${o.a?`<div class="alias">Известна как ${esc(o.a)}</div>`:''}
    <dl class="facts"><div><dt class="mono">Сезон</dt><dd>${SEAS[o.s][0]}${o.s==='winter'?(o.st?', шипованная':', нешипованная'):''}</dd></div>
    <div><dt class="mono">Размеров в наличии</dt><dd class="tnum">${all.length}</dd></div>
    ${o.cy?`<div><dt class="mono">Производство</dt><dd>${esc(o.cy)}</dd></div>`:''}</dl></div></div>
    <div class="tw"><table><thead><tr><th>Размер</th><th>Индекс</th><th style="text-align:right">За 1 шт.</th><th style="text-align:right">Комплект 4 шт.</th><th style="text-align:right">Наличие</th>${SEL?'<th></th>':''}</tr></thead>
    <tbody>${all.map(r=>`<tr class="${hit.has(r.id)&&(f.w||f.p||f.d)?'hit':''}"><td class="sz2">${tSize(r)}</td><td>${r.i||'—'}${r.xl?' XL':''}</td><td class="n">${rub(r.pr)}</td><td class="n"><b>${rub(r.pr*4)}</b></td><td class="n">${stockHtml(r.q)}</td>${SEL?`<td class="n">${addBtn(r)}</td>`:''}</tr>`).join('')}</tbody></table></div>
    <p class="note">Шиномонтаж и балансировку посчитаем отдельно. Нужного размера нет — привезём под заказ.</p>`);}

/* ---------- ДИСКИ ---------- */
const DK={cast:'Литые',steel:'Штампованные',odd:'Некомплект'};
function dMatch(o,skip){const f=S.disks;
  return (skip==='d'||f.d==null||o.d===f.d)&&(skip==='pcd'||f.pcd==null||(o.pcds||[]).includes(f.pcd))&&(skip==='k'||f.k==null||o.k===f.k)
   &&qmatch(`${o.m} ${o.pcd} ${o.n}`);}
function diskSvg(o){
  const holes=+String(o.pcd||'5').split('×')[0]||5;let inner='';
  if(o.k==='steel'){for(let i=0;i<8;i++){const a=i*45*Math.PI/180;inner+=`<ellipse cx="${(100+46*Math.cos(a)).toFixed(1)}" cy="${(100+46*Math.sin(a)).toFixed(1)}" rx="9" ry="13" transform="rotate(${i*45+90} ${(100+46*Math.cos(a)).toFixed(1)} ${(100+46*Math.sin(a)).toFixed(1)})" fill="var(--paper-3)"/>`;}}
  else{const n=holes===4?8:10;for(let i=0;i<n;i++){const a=(i*360/n-90)*Math.PI/180,b=a+Math.PI/n*0.55;
    inner+=`<path d="M${(100+28*Math.cos(a)).toFixed(1)} ${(100+28*Math.sin(a)).toFixed(1)} L${(100+72*Math.cos(a)).toFixed(1)} ${(100+72*Math.sin(a)).toFixed(1)} A72 72 0 0 1 ${(100+72*Math.cos(b)).toFixed(1)} ${(100+72*Math.sin(b)).toFixed(1)} L${(100+28*Math.cos(b)).toFixed(1)} ${(100+28*Math.sin(b)).toFixed(1)}Z" fill="var(--paper-3)"/>`;}}
  let bolts='';for(let i=0;i<holes;i++){const a=(i*360/holes-90)*Math.PI/180;bolts+=`<circle cx="${(100+15*Math.cos(a)).toFixed(1)}" cy="${(100+15*Math.sin(a)).toFixed(1)}" r="2.6" fill="var(--ink)"/>`;}
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="${o.k==='steel'?'var(--ink-2)':'var(--ink-3)'}"/><circle cx="100" cy="100" r="78" fill="var(--paper-2)"/>${inner}<circle cx="100" cy="100" r="24" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="2"/>${bolts}<circle cx="100" cy="100" r="6" fill="var(--paper-3)"/></svg>`;}
const DISKS_PICK=()=>{const f=S.disks,set=k=>v=>{f[k]=v;renderAll();};const out=[];

var PAYS=[["card","Карта"],["cash","Наличные"],["qr","QR-код"],["sbp","Перевод"],["bank","Счёт"]],CPAY="card";
/* покупатель: общий с клиентской базой пульта — подсказка по телефону или имени, история попадёт в его карточку */
let CCL={phone:'',name:'',hint:''};
function cclBind(){const ph=document.getElementById('cPh'),nm=document.getElementById('cNm'),box=document.getElementById('cSug');if(!ph||!nm||!box)return;let tm=null;
  const ask=el=>{CCL.phone=ph.value;CCL.name=nm.value;CCL.hint='';clearTimeout(tm);const q=el.value.trim();if((el===ph?q.replace(/\D/g,'').length<4:q.length<2)){box.innerHTML='';return;}
    tm=setTimeout(async()=>{try{const j=await papi('client_suggest&q='+encodeURIComponent(q));if(el.value.trim()!==q)return;
      box.innerHTML=j.rows.slice(0,5).map((r,i)=>`<button type="button" class="csb" data-ci="${i}"><b>${esc(r.type==='org'?r.org:(r.name||'Без имени'))}</b>${r.phone?` <span class="tnum">${esc(r.phone.replace(/^7(\d{3})(\d{3})(\d{2})(\d{2})$/,'+7 $1 $2-$3-$4'))}</span>`:''}<small>${esc([r.type!=='org'&&r.org?r.org:'',...(r.cars||[]),r.sub||''].filter(Boolean).join(' · '))}</small></button>`).join('');
      box.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{const r=j.rows[+b.dataset.ci];CCL={phone:r.phone?'+'+r.phone:'',name:r.type==='org'?r.org:(r.name||r.org||''),hint:['Наш клиент',r.type!=='org'&&r.org?r.org:'',...(r.cars||[])].filter(Boolean).join(' · ')};ph.value=CCL.phone;nm.value=CCL.name;box.innerHTML=`<p class="chint">${esc(CCL.hint)}</p>`;});}catch(_){}} ,280);};
  ph.oninput=()=>ask(ph);nm.oninput=()=>ask(nm);}
/* из карточки клиента в пульте: «Подбор на витрине» — размер его шин и он сам уже в продаже */
function pickFromPult(){let v=null;try{v=JSON.parse(localStorage.getItem('ivanor_vpick')||'null');localStorage.removeItem('ivanor_vpick');}catch(_){}
  if(!v||Date.now()-(v.t||0)>600000)return;CCL={phone:v.phone||'',name:v.name||'',hint:'Подбор для клиента из пульта'};
  if(v.w&&v.d){S.tab='tires';S.tires.w=+v.w;S.tires.p=+v.p||null;S.tires.d=+v.d;}
  setTimeout(()=>vtoast(`<b>Подбор для: ${esc(v.name||v.phone||'клиента')}</b>${v.w?' размер '+v.w+'/'+(v.p||'')+' R'+v.d:''}`),600);}
async function openCart(){const sum=()=>CART.reduce((a,x)=>a+x.q*x.price,0);
  sheet(`<h2 class="model" id="shTitle" style="font-size:1.6rem;margin:0 0 10px">Продажа</h2>
  ${CART.length?`<div class="cart">${CART.map((x,i)=>`<div class="cl"><div class="cn">${esc(x.name)}${x.price<x.list?`<small>по прайсу ${rub(x.list)} · скидка ${Math.round((1-x.price/x.list)*100)}%</small>`:''}${x.q>x.stock?'<small style="color:var(--signal-deep)">в наличии '+x.stock+' шт</small>':''}</div>
    <div class="cq"><button type="button" data-cq="${i}" data-d="-1">−</button><b>${x.q}</b><button type="button" data-cq="${i}" data-d="1">+</button></div>
    <input class="cp" type="number" inputmode="decimal" min="0" value="${x.price}" data-cp="${i}" aria-label="Цена за штуку"><b class="cs tnum">${rub(x.q*x.price)}</b><button type="button" class="cx" data-cx="${i}" aria-label="Убрать">×</button></div>`).join('')}</div>
    <div class="ctot">Итого: <b class="tnum" id="ctot">${rub(sum())}</b></div>
    <div class="cform"><label>Телефон покупателя<input id="cPh" type="tel" inputmode="tel" placeholder="+7 900 000-00-00" value="${esc(CCL.phone)}" autocomplete="off"></label><label>Имя или организация<input id="cNm" placeholder="Начните вводить — найдём в клиентах" value="${esc(CCL.name)}" autocomplete="off"></label><div class="csug" id="cSug" style="grid-column:1/-1">${CCL.hint?`<p class="chint">${esc(CCL.hint)}</p>`:''}</div>
      <div class="cpay">${PAYS.map(([k,t])=>`<button type="button" data-pay="${k}" aria-pressed="${CPAY===k}">${t}</button>`).join('')}</div>
      <label style="grid-column:1/-1">Комментарий<input id="cNo" placeholder="Например: с монтажом, приедет в 15:00"></label></div>
    <button type="button" class="csend" id="cSend">${SEL.role==='owner'?'Провести продажу':'Отправить на подтверждение'}</button>
    <p class="note">Чек пробивается на Эвоторе как обычно.${SEL.role==='owner'?' Продажа сразу проводится в учёте.':' Продажа появится в учёте после подтверждения.'}</p>`:'<p class="note">Пока пусто. Нажимайте «＋» у товара на витрине.</p>'}
  <h3 class="mysh">Мои продажи сегодня</h3><div id="myS"><p class="note">Загружаю…</p></div>`);
  cclBind();
  document.querySelectorAll('[data-cq]').forEach(b=>b.onclick=()=>{const x=CART[+b.dataset.cq];x.q=Math.max(1,x.q+ +b.dataset.d);saveCart();openCart();});
  document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{CART.splice(+b.dataset.cx,1);saveCart();openCart();});
  document.querySelectorAll('[data-cp]').forEach(inp=>inp.onchange=()=>{const x=CART[+inp.dataset.cp];x.price=Math.max(0,+inp.value||x.list);saveCart();openCart();});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{CPAY=b.dataset.pay;document.querySelectorAll('[data-pay]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  const sd=document.getElementById('cSend');if(sd)sd.onclick=async()=>{sd.disabled=true;try{const j=await papi('sale_request',{lines:CART.map(x=>({id:x.id,q:x.q,price:x.price})),phone:document.getElementById('cPh').value,name:document.getElementById('cNm').value,pay:CPAY,note:document.getElementById('cNo').value});
      if(SEL.role==='owner'){let r=await papi('doc_post',{id:j.id});if(r.needForce){if(!confirm('По учёту не хватает товара:\n'+r.short.join('\n')+'\n\nВсё равно провести?')){vtoast(`<b>Продажа № ${j.id} сохранена черновиком</b> проведите её в пульте`);CART=[];saveCart();openCart();return;}r=await papi('doc_post',{id:j.id,force:true});}}
      CART=[];CCL={phone:'',name:'',hint:''};saveCart();vtoast(SEL.role==='owner'?`<b>Продажа № ${j.id} проведена</b>`:`<b>Продажа № ${j.id} отправлена на подтверждение</b>`);openCart();}catch(e){sd.disabled=false;vtoast('<b>Не отправилось</b> '+esc(e.message));}};
  try{const j=await papi('my_sales');const ST={draft:['ждёт подтверждения','w'],posted:['проведена','ok'],cancelled:['отклонена','x']};
    const tot=j.rows.filter(r=>r.status==='posted').reduce((a,r)=>a+r.sum,0);
    document.getElementById('myS').innerHTML=j.rows.length?`<p class="note" style="margin-top:0">Проведено на ${rub(tot)}</p>${j.rows.map(r=>`<div class="ms"><span class="tnum">${r.time}</span><span>№ ${r.id} · ${esc(r.items)}${r.reason?`<small>причина: ${esc(r.reason)}</small>`:''}</span><b class="tnum">${rub(r.sum)}</b><span class="mst ${ST[r.status][1]}">${ST[r.status][0]}</span></div>`).join('')}`:'<p class="note" style="margin-top:0">Сегодня продаж ещё не было.</p>';}
  catch(e){document.getElementById('myS').innerHTML=`<p class="note">${esc(e.message)}</p>`;}}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='toZak'){const f=S.tires,se={winter:'зима',stud:'шипы',fric:'липучка',summer:'лето',all:'всесезон'}[f.s]||'';try{parent.postMessage({ivanor:'zak',items:`Шины ${f.w}/${f.p} R${f.d}${se?' '+se:''}, 4 шт`,phone:CCL.phone,name:CCL.name},location.origin);}catch(_){}}});
pickFromPult();whoAmI();
/* без интернета витрина открывается с последним сохранённым наличием */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('offline',()=>vtoast('<b>Нет интернета</b> показываю последнее сохранённое наличие'));
/* подбор прокручивается вместе со страницей; когда он ушёл вверх — в шапке короткая строка выбранного */
function psum(){const sel=[...document.querySelectorAll('#pick .chip[aria-pressed="true"]')].map(b=>b.textContent.trim());if(S.q)sel.push('«'+S.q+'»');
  $('#psumT').textContent=sel.length?'Подбор: '+sel.join(' · '):'Подбор не выбран';}
let pickVisible=true;
if('IntersectionObserver' in window)new IntersectionObserver(es=>{pickVisible=es[0].isIntersecting;$('#psum').hidden=pickVisible;},{rootMargin:'-120px 0px 0px 0px'}).observe($('#pickbox'));
$('#psumGo').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

function sheet(html){$('#shIn').innerHTML=`<button class="close" id="close" type="button" aria-label="Закрыть">×</button>`+html;
  const sc=$('#scrim'),sh=$('#sheet');sc.hidden=false;sh.hidden=false;requestAnimationFrame(()=>{sc.classList.add('on');sh.classList.add('on');});
  $('#close').onclick=closeSheet;$('#close').focus();}
function closeSheet(){const sc=$('#scrim'),sh=$('#sheet');sc.classList.remove('on');sh.classList.remove('on');setTimeout(()=>{sc.hidden=true;sh.hidden=true;},380);}
/* нажали на фото товара — показываем крупно; ещё одно нажатие или Esc — закрыть */
function zoomClose(){const z=document.querySelector('.zoom');if(!z)return;z.classList.remove('on');setTimeout(()=>z.remove(),180);}
document.addEventListener('click',e=>{const im=e.target.closest&&e.target.closest('img.pimg');if(!im)return;e.preventDefault();e.stopPropagation();
  zoomClose();const z=document.createElement('div');z.className='zoom';z.setAttribute('role','dialog');z.setAttribute('aria-label','Фото товара');
  z.innerHTML=`<img src="${im.src}" alt=""><button type="button" aria-label="Закрыть">×</button>`;z.onclick=zoomClose;document.body.appendChild(z);requestAnimationFrame(()=>z.classList.add('on'));},true);
$('#scrim').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.zoom'))zoomClose();else closeSheet();}});
document.querySelectorAll('#sort .tool').forEach(b=>b.onclick=()=>{S.sort=b.dataset.sort;document.querySelectorAll('#sort .tool').forEach(x=>x.setAttribute('aria-pressed',x===b));renderOut();});
$('#fs').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){}
  try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(_){}};
const fromHash=()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;};
addEventListener('hashchange',()=>{fromHash();renderAll();});
fromHash();renderAll();
/* живое наличие из учёта (vladautoshina.ru/pult): цены и остатки нашего склада, без себестоимости.
   Нет связи — остаётся встроенная выгрузка каталога. Обновляется раз в 10 минут, пока витрина открыта. */
function loadLive(){pfetch('api.php?a=vitrina',{credentials:'omit',cache:'no-cache'}).then(r=>r.json()).then(j=>{
  if(!j||!j.live||(!(j.tires||[]).length&&!(j.other||[]).length))return;
  if(!$('#sheet').hidden)return;
  TIRES=j.tires;OTHER=j.other;DISKS=by('disk');AKB=by('akb');FAST=by('fast');
  MORE=OTHER.filter(o=>['acc','tube','tool','tireo'].includes(o.t)).map(o=>({...o,g:o.t==='acc'?(o.g||'acc'):o.t}));
  const c={tires:TIRES.length,disks:DISKS.length,akb:AKB.length,fast:FAST.length,more:MORE.length};TABS.forEach(t=>{if(t[0] in c)t[2]=c[t[0]];});
  STAMP=j.stamp;$('#stamp').textContent='Наличие на '+STAMP;renderAll();}).catch(()=>{});}
loadLive();setInterval(loadLive,10*60*1000);
})();
</script>
